<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Actividades</title>
</head>
<body>
    <header>
  <h1>Panel de Actividades</h1>
</header>

<main>
  <section>
    <h2>Para hoy:</h2>
    <ul>
      <li>Estudiar programacion web.</li>
      <li>Practicar ejercicios de programacion.</li>
        <li>Hacer la tarea de matematicas.</li>
        <li>Leer un capitulo del libro.</li>
    </ul>
  </section>

  <section>
    <h2>Nueva tarea</h2>
    <form>
      <label for="titulo">Título de la tarea</label>
      <input type="text" id="titulo" required maxlength="80">
        <br>
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion"></textarea>
        <br>
      <label for="prioridad">Prioridad</label>
      <select id="prioridad">
        <option>baja</option>
        <option>media</option>
        <option>alta</option>
      </select>

      <button>Crear tarea</button>
    </form>
  </section>
</main>

<footer>
  <p>Hecho por Yoelvis Vicente, usando HTML</p>
</footer>
</body>
</html>
